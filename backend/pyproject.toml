[project]
name = "src"
version = "0.1.0"
description = ""
authors = [
    {name = "lesha",email = "slashertoor@gmail.com"}
]
readme = "README.md"
requires-python = "<4.0.0,>=3.12"
dependencies = [
    "fastapi[standard] (>=0.119.0,<0.120.0)",
    "ruff (>=0.14.1,<0.15.0)",
    "aiosqlite (>=0.21.0,<0.22.0)",
    "sqlalchemy (>=2.0.44,<3.0.0)",
    "natasha (>=1.6.0,<2.0.0)",
    "python-multipart (>=0.0.20,<0.0.21)",
    "setuptools (>=80.9.0,<81.0.0)",
    "langchain[google-genai] (>=1.0.2,<2.0.0)",
    "langchain-huggingface (>=1.0.0,<2.0.0)",
    "sentence-transformers (>=5.1.2,<6.0.0)",
    "langchain-chroma (>=1.0.0,<2.0.0)",
    "langchain-community (>=0.4,<0.5)",
    "chromadb (>=1.2.1,<2.0.0)",
    "langchain-google-genai (>=3.0.0,<4.0.0)",
    "langchain-text-splitters (>=1.0.0,<2.0.0)",
    "bs4 (>=0.0.2,<0.0.3)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
ruff = "^0.14.1"

[tool.ruff]
line-length=80

[tool.ruff.lint]

# Включение правил для импортов
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort (сортировка импортов)
    "UP", # pyupgrade
    "ARG", # unused arguments
    "COM", # commas
    "ERA", # commented out code
    "FBT", # boolean trap
]


